<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLIIT Courseweb Cleaner</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-wrapper" id="popup-container">
        <!-- Header -->
        <header class="popup-header">
            <div class="popup-brand">
                <img src="icons/icon_48.png" alt="Logo" class="popup-logo">
                <div class="popup-titles">
                    <h2>Courseweb Cleaner</h2>
                    <span class="popup-version">v7.1.0</span>
                </div>
            </div>
            <button id="popup-theme-toggle" class="popup-icon-btn" title="Toggle Theme">
                <svg id="popup-theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </header>

        <!-- Main Controls -->
        <div class="popup-controls">
            <!-- Toggles -->
            <div class="popup-card">
                <div class="popup-toggle-row">
                    <div class="toggle-text">
                        <span class="toggle-title">Module Filter</span>
                        <span class="toggle-subtitle">Filter unassigned materials</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="pop-enabled">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="popup-toggle-row">
                    <div class="toggle-text">
                        <span class="toggle-title">Ghost Mode</span>
                        <span class="toggle-subtitle">Fade filtered items instead of hiding</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="pop-ghost">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Profile Settings -->
            <div class="popup-card">
                <label class="field-label" for="pop-campus">Target Campus</label>
                <div class="select-wrapper">
                    <select id="pop-campus" class="popup-select">
                        <option value="malabe">Malabe</option>
                        <option value="metro">Metro</option>
                        <option value="kandy">Kandy</option>
                        <option value="kurunegala">Kurunegala</option>
                        <option value="matara">Matara</option>
                        <option value="jaffna">Jaffna</option>
                        <option value="deakin">Deakin</option>
                    </select>
                </div>

                <label class="field-label" for="pop-type">Batch Classification</label>
                <div class="select-wrapper">
                    <select id="pop-type" class="popup-select">
                        <option value="weekday">Weekday (WD)</option>
                        <option value="weekend">Weekend (WE)</option>
                    </select>
                </div>

                <label class="field-label" for="pop-group">Group ID (Optional)</label>
                <input type="text" id="pop-group" class="popup-input" placeholder="e.g., 0301">
            </div>

            <!-- Page Quick Action -->
            <div class="popup-actions">
                <button class="btn btn-secondary" id="btn-open-modal">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    Open In-Page Settings
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="popup-footer">
            <a href="https://sliit-courseweb-cleaner.pages.dev" target="_blank" rel="noreferrer">Website</a>
            <span class="footer-dot">•</span>
            <a href="https://github.com/dulithdivisekara/sliit-courseweb-cleaner" target="_blank" rel="noreferrer">GitHub</a>
            <span class="footer-dot">•</span>
            <a href="https://github.com/dulithdivisekara/sliit-courseweb-cleaner/issues" target="_blank" rel="noreferrer">Support</a>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
